<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云海螺 · Logo 纹理工坊</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f1ed;color:#252423;font:14px system-ui,"Microsoft YaHei",sans-serif}header{height:82px;padding:0 32px;background:#fff;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5e2dc}header img{width:110px}h1{font-size:18px;margin:0}small,.muted{color:#86817a}main{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 82px)}aside{background:#fff;padding:24px;overflow:auto}h2{font-size:12px;letter-spacing:2px;color:#99918a;margin:24px 0 16px}h2:first-child{margin-top:0}label{display:block;margin:15px 0 8px}label span{float:right;color:#8d585c;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#fb0023}input[type=number],select{width:100%;border:1px solid #dedbd6;padding:9px;border-radius:7px;background:white;color:#333}button,.upload{cursor:pointer;border:1px solid #e0dcd6;border-radius:8px;padding:10px 12px;background:#fff;font:inherit}button:hover,.upload:hover{background:#f8f2ef}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.primary{width:100%;background:#fb0023;color:#fff;border:0;font-weight:600;padding:14px}.primary:hover{background:#d90020}.upload{display:block;text-align:center}#file{display:none}.stage{padding:26px 36px;display:flex;flex-direction:column;align-items:center;gap:18px}.bar{width:100%;display:flex;justify-content:space-between;color:#79736d}.paper{flex:1;min-height:400px;width:100%;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#e7e4df 0 25%,#eeece8 0 50%) 0/16px 16px;border-radius:12px;padding:26px}canvas{display:block;max-width:100%;max-height:calc(100vh - 230px);box-shadow:0 12px 40px #28201a20;object-fit:contain}.note{font-size:12px;line-height:1.7;margin:10px 0;color:#8d8780}input[type=color]{width:100%;height:34px;border:1px solid #ddd;background:white;border-radius:6px}.check{display:flex;align-items:center;gap:7px}#status{min-height:18px;font-size:12px;color:#857971}@media(max-width:760px){main{grid-template-columns:1fr}aside{order:2}.stage{padding:18px;position:sticky;top:0;background:#f3f1ed;z-index:1}.paper{min-height:260px;padding:15px}canvas{max-height:40vh}header{padding:0 18px}header small{display:none}}label span input{width:68px!important;padding:3px 5px!important;text-align:right;font-size:13px}label span{display:flex;align-items:center;gap:4px}button:disabled{opacity:.55;cursor:wait}</style>
<header><div class="row" style="align-items:center;gap:22px"><img src="logo.png" alt="eHello"><h1>纹理工坊</h1></div><small>让品牌，铺满每一处灵感。</small></header>
<main><aside><h2>01 / 图案与风格</h2><div class="row"><button id="soft">淡色纹理</button><button id="red">品牌红</button></div><label class="upload" for="file">＋ 更换 Logo 图片</label><input id="file" type="file" accept="image/*"><p class="note">已载入你的红色 Logo。上传的图片仅在本机处理。</p>
<h2>02 / 排列调整</h2><label>倾斜角度 <span id="angleV"></span></label><input id="angle" type="range" min="-90" max="90" value="12"><label>每行数量 <span id="countV"></span></label><input id="count" type="range" min="2" max="30" value="11"><label>横向间隙 <span id="gapXV"></span></label><input id="gapX" type="range" min="0" max="150" value="16"><label>纵向间隙 <span id="gapYV"></span></label><input id="gapY" type="range" min="0" max="200" value="22"><label>逐行错位 <span id="offsetV"></span></label><input id="offset" type="range" min="0" max="100" value="10"><label>Logo 不透明度 <span id="opacityV"></span></label><input id="opacity" type="range" min="5" max="100" value="20">
<h2>03 / 画布与导出</h2><select id="size"><option value="2480,3508">A4 竖版 · 2480 × 3508</option><option value="3508,2480">A4 横版 · 3508 × 2480</option><option value="4000,4000">正方形 · 4000 × 4000</option><option value="3840,2160">4K 横版 · 3840 × 2160</option><option value="custom">自定义尺寸</option></select><div class="row"><div><label for="width">宽 / px</label><input id="width" type="number" min="100" max="10000" value="2480"></div><div><label for="height">高 / px</label><input id="height" type="number" min="100" max="10000" value="3508"></div></div><div class="row"><div><label for="ink">Logo 颜色</label><input id="ink" type="color" value="#fb0023"></div><div><label for="bg">背景颜色</label><input id="bg" type="color" value="#ffffff"></div></div><label class="check"><input id="transparent" type="checkbox">透明背景</label><button class="primary" id="download">↓ 导出高清 PNG</button><p class="note">预览与导出使用相同排版。按设定的实际像素导出，最高支持 4000 万像素。</p><div id="status" role="status"></div></aside><section class="stage"><div class="bar"><span>实时预览</span><span id="info"></span></div><div class="paper"><canvas id="preview"></canvas></div><span class="muted" style="font-size:12px">拖动滑块，即时看到最终效果</span></section></main>
<script>
const $=id=>document.getElementById(id);let source=new Image(),mask=document.createElement('canvas'),tint=document.createElement('canvas'),ready=false;const ids=['angle','count','gapX','gapY','offset','opacity'];
function prepare(){mask.width=source.naturalWidth;mask.height=source.naturalHeight;const c=mask.getContext('2d',{willReadFrequently:true});c.drawImage(source,0,0);const d=c.getImageData(0,0,mask.width,mask.height);for(let i=0;i<d.data.length;i+=4){const whiteness=Math.min(d.data[i],d.data[i+1],d.data[i+2])/255;d.data[i+3]=Math.round(d.data[i+3]*(1-whiteness));}c.putImageData(d,0,0);ready=true;render();}
source.onload=prepare;source.src='logo.png';
function dimensions(){return [Number($('width').value),Number($('height').value)]}function valid(w,h){return Number.isInteger(w)&&Number.isInteger(h)&&w>=100&&h>=100&&w<=10000&&h<=10000&&w*h<=40000000}
function draw(canvas,w,h,scale=1){canvas.width=Math.round(w*scale);canvas.height=Math.round(h*scale);const ctx=canvas.getContext('2d');ctx.scale(canvas.width/w,canvas.height/h);if(!$('transparent').checked){ctx.fillStyle=$('bg').value;ctx.fillRect(0,0,w,h)}tint.width=mask.width;tint.height=mask.height;const t=tint.getContext('2d');t.drawImage(mask,0,0);t.globalCompositeOperation='source-in';t.fillStyle=$('ink').value;t.fillRect(0,0,tint.width,tint.height);const count=+$('count').value,gx=+$('gapX').value/100,gy=+$('gapY').value/100,a=+$('angle').value*Math.PI/180;const pitch=w/count,lw=pitch/(1+gx),lh=lw*mask.height/mask.width,bw=Math.abs(lw*Math.cos(a))+Math.abs(lh*Math.sin(a)),bh=Math.abs(lw*Math.sin(a))+Math.abs(lh*Math.cos(a)),py=bh+lw*gy,shift=pitch*+$('offset').value/100;ctx.globalAlpha=+$('opacity').value/100;let rows=0;for(let y=-bh,row=-1;y<h+bh;y+=py,row++){rows++;const dx=((row*shift)%pitch+pitch)%pitch;for(let x=-bw-pitch+dx;x<w+bw;x+=pitch){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.drawImage(tint,-lw/2,-lh/2,lw,lh);ctx.restore()}}return rows;}
ids.forEach(id=>{const slider=$(id),box=document.createElement('input');box.type='number';box.min=slider.min;box.max=slider.max;box.step='1';box.value=slider.value;box.id=id+'Number';box.setAttribute('aria-label',({angle:'倾斜角度',count:'每行数量',gapX:'横向间隙',gapY:'纵向间隙',offset:'逐行错位',opacity:'不透明度'}[id])+'数值');$(id+'V').replaceChildren(box,document.createTextNode({angle:'°',count:'个',gapX:'%',gapY:'%',offset:'%',opacity:'%'}[id]));box.oninput=()=>{if(box.value!==''&&Number.isFinite(+box.value)){slider.value=Math.round(Math.max(+slider.min,Math.min(+slider.max,+box.value)));render()}};box.onblur=()=>{box.value=slider.value}});function render(){ids.forEach(id=>{if(document.activeElement!==$(id+'Number'))$(id+'Number').value=$(id).value});const [w,h]=dimensions();if(!valid(w,h)){$('status').textContent='尺寸需为 100–10000 的整数，且总像素不超过 4000 万。';$('download').disabled=true;return}$('status').textContent='';$('download').disabled=!ready;if(!ready)return;draw($('preview'),w,h,Math.min(1,1400/Math.max(w,h)));$('info').textContent=`${w} × ${h} px`;}
[...ids,'width','height','ink','bg','transparent'].forEach(id=>$(id).addEventListener('input',()=>{if(id==='width'||id==='height')$('size').value='custom';render()}));$('size').onchange=()=>{if($('size').value!=='custom'){[$('width').value,$('height').value]=$('size').value.split(',');render()}};
$('soft').onclick=()=>{$('opacity').value=20;$('ink').value='#fb0023';$('angle').value=12;$('count').value=11;$('gapX').value=16;$('gapY').value=22;$('offset').value=10;render()};$('red').onclick=()=>{$('opacity').value=100;$('ink').value='#fb0023';render()};
$('file').onchange=()=>{const f=$('file').files[0];if(!f)return;const url=URL.createObjectURL(f),img=new Image();img.onload=()=>{source=img;prepare();URL.revokeObjectURL(url)};img.onerror=()=>{$('status').textContent='图片无法读取，请使用 PNG、JPG 或 SVG 图片。';URL.revokeObjectURL(url)};img.src=url};
$('download').onclick=()=>{const [w,h]=dimensions();if(!ready||!valid(w,h))return;$('download').disabled=true;$('status').textContent='正在生成高清图片…';setTimeout(()=>{try{const c=document.createElement('canvas');draw(c,w,h);c.toBlob(blob=>{if(!blob){$('status').textContent='导出失败，请减小尺寸重试。';$('download').disabled=false;return}if(window.pywebview?.api){const reader=new FileReader();reader.onload=async()=>{try{const result=await window.pywebview.api.save_png(reader.result,w,h);$('status').textContent=result.ok?'已保存：'+result.path:(result.cancelled?'已取消保存。':'保存失败：'+result.error)}catch(e){$('status').textContent='保存失败：'+e.message}finally{$('download').disabled=false;c.width=c.height=1}};reader.readAsDataURL(blob);return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`eHello-纹理-${w}x${h}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);$('status').textContent='高清 PNG 已生成。';$('download').disabled=false;c.width=c.height=1},'image/png')}catch(e){$('status').textContent='导出失败，请减小尺寸重试。';$('download').disabled=false}},50)};render();
</script></html>
